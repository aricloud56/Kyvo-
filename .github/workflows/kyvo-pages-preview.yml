name: Publish KYVO sample-data preview

on:
  push:
    branches:
      - kyvo/premium-today-live-ui-2026-10-22
    paths:
      - '.github/workflows/kyvo-pages-preview.yml'
      - 'src/client/**'
      - 'src/core/**'
      - 'public/**'
      - 'data/**'
      - 'scripts/build-preview.mjs'
      - 'package.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/kyvo-pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kyvo-sample-preview-pages
  cancel-in-progress: true

jobs:
  deploy-sample-preview:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kyvo/premium-today-live-ui-2026-10-22')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development tools without lockfile
        run: npm install --no-package-lock --ignore-scripts
      - name: Type-check source
        run: npm run typecheck
      - name: Build static sample-data app
        run: npm run preview
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload isolated static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/preview
      - name: Publish sample preview
        id: deployment
        uses: actions/deploy-pages@v4
